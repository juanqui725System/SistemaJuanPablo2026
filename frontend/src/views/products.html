<div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow">
    <!-- Encabezado -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <h2 class="text-2xl font-bold text-gray-800">
            <i class="fa-solid fa-boxes-stacked text-blue-600 mr-2"></i>Lista de Productos
        </h2>
        <button id="btnNuevoProducto"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition-colors flex items-center gap-2">
            Hola<!-- <i class="fa-solid fa-circle-plus"></i> Nuevo Producto -->
        </button>
    </div>

    <!-- Tabla -->
    <div class="overflow-x-auto rounded-lg border border-gray-200">
        <table class="w-full text-left border-collapse bg-white text-sm text-gray-500">
            <thead class="bg-gray-800 text-gray-100 uppercase text-xs font-semibold">
                <tr>
                    <th class="px-6 py-4">ID</th>
                    <th class="px-6 py-4">Código de Barras</th>
                    <th class="px-6 py-4">Descripción</th>
                    <th class="px-6 py-4">Stock</th>
                    <th class="px-6 py-4">Precio Unitario</th>
                    <th class="px-6 py-4">Creado Por</th>
                    <th class="px-6 py-4">Fecha Registro</th>
                    <th class="px-6 py-4 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                <!-- Fila de ejemplo -->
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-medium text-gray-900">1</td>
                    <td class="px-6 py-4">7501234567890</td>
                    <td class="px-6 py-4">Producto de Ejemplo A</td>
                    <td class="px-6 py-4 font-semibold text-gray-700">50</td>
                    <td class="px-6 py-4 text-emerald-600 font-semibold">$ 15.50</td>
                    <td class="px-6 py-4">2</td>
                    <td class="px-6 py-4 text-gray-400">2026-10-14 15:40</td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="editarProducto(1)"
                                class="p-2 text-amber-600 hover:bg-amber-50 rounded transition-colors" title="Editar">
                                <i class="fa-solid fa-pen-to-square text-base"></i>
                            </button>
                            <button onclick="eliminarProducto(1)"
                                class="p-2 text-red-600 hover:bg-red-50 rounded transition-colors" title="Eliminar">
                                <i class="fa-solid fa-trash text-base"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL (Oculto por defecto usando 'hidden') -->
<div id="modalProducto"
    class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden transform transition-all">
        <!-- Modal Header -->
        <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
            <h3 class="text-lg font-bold" id="modalTitulo">Registrar Nuevo Producto</h3>
            <button id="btnCerrarX" class="text-white hover:text-gray-200 text-xl focus:outline-none">&times;</button>
        </div>

        <!-- Modal Body -->
        <form id="formProducto" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Código de Barras *</label>
                <input type="text" id="codBarras" maxlength="100" required
                    class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descripción *</label>
                <input type="text" id="descripcion" maxlength="100" required
                    class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Stock *</label>
                    <input type="number" id="stock" min="0" step="1" required
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Precio Unitario *</label>
                    <div class="relative rounded shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">$</span>
                        </div>
                        <input type="number" id="precio_unitario" min="0" step="0.01" required
                            class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">ID Creador <span
                        class="text-gray-400 capitalize">(Opcional)</span></label>
                <input type="number" id="creado_por" step="1"
                    class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <!-- Modal Footer -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                <button type="button" id="btnCancelar"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition-colors">Cancelar</button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded transition-colors shadow">Guardar
                    Producto</button>
            </div>
        </form>
    </div>
</div>
