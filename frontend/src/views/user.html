<div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Usuarios</h2>
    <button class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">+ Nuevo Usuario</button>
</div>
<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50">
        <p class="text-sm text-gray-500">Listado de usuarios registrados</p>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-100">
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Usuario</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Estado</th>
                    <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody id="userTableList" class="divide-y divide-gray-100">
                <tr>
                    <td class="px-6 py-8 text-center text-gray-400" colspan="4">No hay usuarios registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
