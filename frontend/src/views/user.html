<div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Usuarios</h2>
    <button id="openUserModal" type="button" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">+ Nuevo Usuario</button>
</div>

<div id="userModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
    <div class="w-full max-w-lg rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
            <h3 id="userModalTitle" class="text-lg font-semibold text-gray-800">Adicionar usuario</h3>
            <button id="closeUserModal" type="button" class="rounded p-1 text-gray-500 hover:bg-gray-100" aria-label="Cerrar">&times;</button>
        </div>
        <form id="userForm" class="space-y-4 p-6">
            <div>
                <label for="newUsername" class="mb-1 block text-sm font-medium text-gray-700">Nombre de usuario</label>
                <input id="newUsername" name="username" type="text" maxlength="50" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="newEmail" class="mb-1 block text-sm font-medium text-gray-700">Correo electrónico</label>
                <input id="newEmail" name="email" type="email" maxlength="50" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="newPassword" class="mb-1 block text-sm font-medium text-gray-700">Contraseña</label>
                <input id="newPassword" name="password" type="password" maxlength="255" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="newRole" class="mb-1 block text-sm font-medium text-gray-700">Rol</label>
                <select id="newRole" name="rol" required class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
                    <option value="">Seleccione un rol</option>
                    <option value="administrador">Administrador</option>
                    <option value="vendedor">Vendedor</option>
                </select>
            </div>
            <div>
                <label for="newEmployee" class="mb-1 block text-sm font-medium text-gray-700">Empleado</label>
                <select id="newEmployee" name="cod_empleado" required class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
                    <option value="">Seleccione un empleado</option>
                </select>
            </div>
            <p id="userFormMessage" class="hidden text-sm" role="alert"></p>
            <div class="flex justify-end gap-3 pt-2">
                <button id="cancelUserModal" type="button" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</button>
                <button id="saveUser" type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60">Guardar usuario</button>
            </div>
        </form>
    </div>
</div>
<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-4 border-b border-gray-100 bg-gray-50">
        <p class="text-sm text-gray-500">Listado de usuarios registrados</p>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-100">
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Usuario</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Rol</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Estado</th>
                    <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Correo Electrónico</th>
                    <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody id="userTableList" class="divide-y divide-gray-100">
                <tr>
                    <td class="px-6 py-8 text-center text-gray-400" colspan="6">No hay usuarios registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
